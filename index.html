<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing</title>
    <style>
        .content-block {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 20px;
            position: relative;
        }
        .copy-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Select a Practical</h1>
    <select id="practicalSelect">
        <option value="">--Select a Practical--</option>
        <option value="practical1">Practical 1</option>
        <option value="practical2">Practical 2</option>
        <option value="practical3">Practical 3</option>
        <option value="practical4">Practical 4</option>
        <option value="practical5">Practical 5</option>
        <option value="practical6">Practical 6</option>
        <option value="practical7">Practical 7</option>
        <option value="practical8">Practical 8</option>
        <option value="practical9">Practical 9</option>
        <option value="practical10">Practical 10</option>
        <option value="practical11">Practical 11</option>
        <option value="practical12">Practical 12</option>
        <option value="practical13">Practical 13</option>
    </select>

    <div id="contentBlock" class="content-block" style="display: none;">
        <button class="copy-button" onclick="copyContent()">Copy</button>
        <div id="content"></div>
    </div>

    <script>
        const contentMap = {
            'practical1': 'Content for Practical 1',
            'practical2': 'Content for Practical 2',
            'practical3': 'Content for Practical 3',
            'practical4': 'Content for Practical 4',
            'practical5': 'Content for Practical 5',
            'practical6': 'Content for Practical 6',
            'practical7': 'Content for Practical 7',
            'practical8': 'Content for Practical 8',
            'practical9': 'Content for Practical 9',
            'practical10': 'Content for Practical 10',
            'practical11': 'Content for Practical 11',
            'practical12': 'Content for Practical 12',
            'practical13': 'Content for Practical 13'
        };

        document.getElementById('practicalSelect').addEventListener('change', function() {
            const selectedValue = this.value;
            if (selectedValue) {
                document.getElementById('content').innerText = contentMap[selectedValue];
                document.getElementById('contentBlock').style.display = 'block';
            } else {
                document.getElementById('contentBlock').style.display = 'none';
            }
        });

        function copyContent() {
            const content = document.getElementById('content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                const copyButton = document.querySelector('.copy-button');
                copyButton.textContent = 'Copied';
                setTimeout(() => {
                    copyButton.textContent = 'Copy';
                }, 2000); // Reset after 2 seconds
            });
        }
    </script>
</body>
</html>
